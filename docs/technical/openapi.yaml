openapi: 3.1.1
info:
  title: RepHarbor API
  version: 0.1.0
  description: V1 target contract. Monetary amounts are decimal integer strings in minor units. See api-rules.md for authorization,
    cursor, and retry semantics.
servers:
- url: /v1
paths:
  /auth/magic-links:
    post:
      tags:
      - A1
      operationId: requestMagicLink
      summary: Request a sign-in email
      x-access: public
      security: []
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                returnPath:
                  type: string
                  minLength: 1
                invitationToken:
                  type: string
                  minLength: 1
  /auth/sessions:
    post:
      tags:
      - A1
      operationId: exchangeMagicLink
      summary: Exchange a single-use token for a session
      x-access: public
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie:
              description: Host-only HttpOnly session cookie; Secure in deployed environments.
              schema:
                type: string
                minLength: 1
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '410':
          $ref: '#/components/responses/E410'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - token
              properties:
                token:
                  type: string
                  minLength: 1
  /auth/session:
    get:
      tags:
      - A1
      operationId: getSession
      summary: Get identity and founder memberships
      x-access: member
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
    delete:
      tags:
      - A1
      operationId: signOut
      summary: Revoke the current session
      x-access: member
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Completed
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
  /companies:
    post:
      tags:
      - B2
      operationId: createCompany
      summary: Create a company and founder membership
      x-access: member
      security:
      - sessionCookie: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - timeZone
              properties:
                name:
                  type: string
                  minLength: 1
                timeZone:
                  type: string
                  minLength: 1
  /companies/{companyId}/products:
    get:
      tags:
      - B2
      operationId: listProducts
      summary: List products for this company
      x-access: founder
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
    post:
      tags:
      - B2
      operationId: createProduct
      summary: Create a product
      x-access: founder
      security:
      - sessionCookie: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
  /companies/{companyId}/invitations:
    post:
      tags:
      - B2
      operationId: inviteRep
      summary: Create the proposed engagement, terms, and rep invitation
      x-access: founder
      security:
      - sessionCookie: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - productId
              - terms
              properties:
                email:
                  type: string
                  format: email
                productId:
                  type: string
                  format: uuid
                terms:
                  type: object
                  additionalProperties: false
                  required:
                  - rateBps
                  - basis
                  - accrualMode
                  - eligibilityMonths
                  - refundPolicy
                  - cadence
                  - dueDay
                  - timeZone
                  - effectiveAt
                  properties:
                    rateBps:
                      type: integer
                      minimum: 0
                      maximum: 10000
                    basis:
                      type: string
                      enum:
                      - collected_ex_tax_before_fees
                    accrualMode:
                      type: string
                      enum:
                      - first_payment
                      - recurring
                    eligibilityMonths:
                      type: integer
                      minimum: 1
                    refundPolicy:
                      type: string
                      enum:
                      - reverse_original_rate
                    cadence:
                      type: string
                      enum:
                      - monthly
                    dueDay:
                      type: integer
                      minimum: 1
                      maximum: 28
                    timeZone:
                      type: string
                      minLength: 1
                    effectiveAt:
                      type: string
                      format: date-time
  /portfolio/invitations:
    post:
      tags:
      - B2
      operationId: inviteFounder
      summary: Invite a founder to start an engagement
      x-access: member
      security:
      - sessionCookie: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
  /invitations/preview:
    post:
      tags:
      - B2
      operationId: previewInvitation
      summary: Preview an invitation addressed to this account
      x-access: invitee
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - invitation
                properties:
                  invitation:
                    $ref: '#/components/schemas/Invitation'
                  companyName:
                    type: string
                    minLength: 1
                  productName:
                    type: string
                    minLength: 1
                  terms:
                    $ref: '#/components/schemas/AgreementVersion'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '410':
          $ref: '#/components/responses/E410'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                additionalProperties: false
                required:
                - token
                properties:
                  token:
                    type: string
                    minLength: 1
              - type: object
                additionalProperties: false
                required:
                - invitationId
                properties:
                  invitationId:
                    type: string
                    format: uuid
  /invitations/accept:
    post:
      tags:
      - B2
      operationId: acceptInvitation
      summary: Join the engagement; agreement acceptance is a separate action
      x-access: invitee
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engagement'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '410':
          $ref: '#/components/responses/E410'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                additionalProperties: false
                required:
                - token
                properties:
                  token:
                    type: string
                    minLength: 1
                  companyId:
                    type: string
                    format: uuid
                  productId:
                    type: string
                    format: uuid
              - type: object
                additionalProperties: false
                required:
                - invitationId
                properties:
                  invitationId:
                    type: string
                    format: uuid
                  companyId:
                    type: string
                    format: uuid
                  productId:
                    type: string
                    format: uuid
  /invitations/{invitationId}/revoke:
    post:
      tags:
      - B2
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      x-access: sender
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Completed
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /companies/{companyId}/engagements:
    get:
      tags:
      - U4
      operationId: getCompanyDashboard
      summary: List engagements and per-currency balances
      x-access: founder
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
  /portfolio/engagements:
    get:
      tags:
      - U4
      operationId: getRepPortfolio
      summary: List engagements and per-currency balances
      x-access: member
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
  /engagements/{engagementId}:
    get:
      tags:
      - B2
      operationId: getEngagement
      summary: Read an engagement and applicable role
      x-access: participant
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - engagement
                - viewerRole
                properties:
                  engagement:
                    $ref: '#/components/schemas/Engagement'
                  viewerRole:
                    type: string
                    enum:
                    - founder
                    - rep
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /engagements/{engagementId}/agreements:
    get:
      tags:
      - B2
      operationId: listAgreementVersions
      summary: List proposals and accepted versions
      x-access: participant
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
    post:
      tags:
      - B2
      operationId: proposeAgreement
      summary: Propose and sign a new terms version
      x-access: founder
      security:
      - sessionCookie: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementVersion'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - previousRevision
              - terms
              properties:
                previousRevision:
                  type: integer
                  minimum: 0
                terms:
                  type: object
                  additionalProperties: false
                  required:
                  - rateBps
                  - basis
                  - accrualMode
                  - eligibilityMonths
                  - refundPolicy
                  - cadence
                  - dueDay
                  - timeZone
                  - effectiveAt
                  properties:
                    rateBps:
                      type: integer
                      minimum: 0
                      maximum: 10000
                    basis:
                      type: string
                      enum:
                      - collected_ex_tax_before_fees
                    accrualMode:
                      type: string
                      enum:
                      - first_payment
                      - recurring
                    eligibilityMonths:
                      type: integer
                      minimum: 1
                    refundPolicy:
                      type: string
                      enum:
                      - reverse_original_rate
                    cadence:
                      type: string
                      enum:
                      - monthly
                    dueDay:
                      type: integer
                      minimum: 1
                      maximum: 28
                    timeZone:
                      type: string
                      minLength: 1
                    effectiveAt:
                      type: string
                      format: date-time
  /engagements/{engagementId}/agreements/{agreementId}/accept:
    post:
      tags:
      - B2
      operationId: acceptAgreement
      summary: Accept the current proposal
      x-access: rep
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementVersion'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: agreementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - revision
              properties:
                revision:
                  type: integer
                  minimum: 0
  /engagements/{engagementId}/close:
    post:
      tags:
      - B2
      operationId: closeEngagement
      summary: Close intake and retain existing rights
      x-access: founder
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engagement'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /engagements/{engagementId}/claims:
    get:
      tags:
      - B2
      operationId: listClaims
      summary: List registered prospects
      x-access: participant
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
    post:
      tags:
      - B2
      operationId: registerClaim
      summary: Register a prospect for this engagement
      x-access: rep
      security:
      - sessionCookie: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
