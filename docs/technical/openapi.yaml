        schema:
          type: string
          format: uuid
  /webhooks/{provider}/{connectionId}:
    post:
      tags:
      - I3
      operationId: receiveSalesEvent
      summary: Authenticate the raw vendor envelope and persist before acknowledgment
      x-access: provider
      security: []
      responses:
        '204':
          description: Completed
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - stripe
          - dodo
          - whop
          - revenuecat
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      description: Uses provider-specific authentication on the raw HTTP request. No browser session. The application authenticates
        the configured source before accepting an event. See backend.md.
      x-provider-auth: connection-specific
  /billing/webhooks/stripe:
    post:
      tags:
      - S6
      operationId: receiveBillingEvent
      summary: Authenticate the raw vendor envelope and persist before acknowledgment
      x-access: provider
      security: []
      responses:
        '204':
          description: Completed
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      description: Uses provider-specific authentication on the raw HTTP request. No browser session. The application authenticates
        the configured source before accepting an event. See backend.md.
      x-provider-auth: stripe-billing-signature
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rh_session
  schemas:
    Company:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - timeZone
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        timeZone:
          type: string
          minLength: 1
    Product:
      type: object
      additionalProperties: false
      required:
      - id
      - companyId
      - name
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    Session:
      type: object
      additionalProperties: false
      required:
      - userId
      - email
      - companies
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        pendingInvitationId:
          type: string
          format: uuid
        returnPath:
          description: Validated relative app destination returned only on successful link exchange.
          type: string
          minLength: 1
    Engagement:
      type: object
      additionalProperties: false
      required:
      - id
      - companyId
      - productId
      - status
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        repId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - invited
          - active
          - closed
    AgreementVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - engagementId
      - revision
      - rateBps
      - basis
      - accrualMode
      - eligibilityMonths
      - refundPolicy
      - cadence
      - dueDay
      - timeZone
      - effectiveAt
      - founderAcceptedAt
      properties:
        id:
          type: string
          format: uuid
        engagementId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        rateBps:
          type: integer
          minimum: 0
          maximum: 10000
        basis:
          type: string
          enum:
          - collected_ex_tax_before_fees
        accrualMode:
          type: string
          enum:
          - first_payment
          - recurring
        eligibilityMonths:
          type: integer
          minimum: 1
        refundPolicy:
          type: string
          enum:
          - reverse_original_rate
        cadence:
          type: string
          enum:
          - monthly
        dueDay:
          type: integer
          minimum: 1
          maximum: 28
        timeZone:
          type: string
          minLength: 1
        effectiveAt:
          type: string
          format: date-time
        founderAcceptedAt:
          type: string
          format: date-time
        repAcceptedAt:
          type: string
          format: date-time
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - direction
      - expiresAt
      - status
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - invite_rep
          - invite_founder
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
        engagementId:
          type: string
          format: uuid
    Claim:
      type: object
      additionalProperties: false
      required:
      - id
      - engagementId
      - customerLabel
      - status
      properties:
        id:
          type: string
          format: uuid
        engagementId:
          type: string
          format: uuid
        customerLabel:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - pending
          - approved
          - declined
        contactEmail:
          type: string
          format: email
        reason:
          type: string
          minLength: 1
        competingClaimCount:
          description: Other pending or approved claims for the same product and customer, visible to the founder only.
          type: integer
          minimum: 0
    Connection:
      type: object
      additionalProperties: false
      required:
      - id
      - companyId
      - provider
      - environment
      - externalAccount
      - status
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - stripe
          - dodo
          - whop
          - revenuecat
        environment:
          type: string
          enum:
          - test
          - live
        externalAccount:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - pending
          - active
          - degraded
          - disconnected
        coverageFrom:
          type: string
          format: date-time
        lastDeliveryAt:
          type: string
          format: date-time
        reconciledAt:
          type: string
          format: date-time
    ProductMapping:
      type: object
      additionalProperties: false
      required:
      - productId
      - externalProduct
      - channel
      - authoritative
      properties:
        productId:
          type: string
          format: uuid
        externalProduct:
          type: string
          minLength: 1
        channel:
          type: string
          minLength: 1
        authoritative:
          type: boolean
    ReviewItem:
      type: object
      additionalProperties: false
      required:
      - id
      - effectId
      - reason
      - customerLabel
      - candidateClaimIds
      properties:
        id:
          type: string
          format: uuid
        effectId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
        customerLabel:
          type: string
          minLength: 1
        candidateClaimIds:
          type: array
          items:
            type: string
            format: uuid
        candidateClaims:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, customerLabel]
            properties:
              id:
                type: string
                format: uuid
              customerLabel:
                type: string
                minLength: 1
        resolvedAt:
          type: string
          format: date-time
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amountMinor:
          type: string
          pattern: ^(0|-?[1-9][0-9]*)$
        postedEngagementId:
          type: string
          format: uuid
        postedEntryId:
          type: string
          format: uuid
    CoverageGap:
      type: object
      additionalProperties: false
      required:
      - id
      - startsAt
      - reason
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
        resolvedAt:
          type: string
          format: date-time
    Balance:
      type: object
      additionalProperties: false
      required:
      - currency
      - accruedMinor
      - recordedPaymentsMinor
      - outstandingMinor
      - dueMinor
      - openingStatus
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        accruedMinor:
          type: string
          pattern: ^(0|-?[1-9][0-9]*)$
        recordedPaymentsMinor:
          type: string
          pattern: ^(0|-?[1-9][0-9]*)$
        outstandingMinor:
          type: string
          pattern: ^(0|-?[1-9][0-9]*)$
        dueMinor:
          type: string
          pattern: ^(0|-?[1-9][0-9]*)$
        openingStatus:
          type: string
          enum:
          - known
          - unknown
      example:
        currency: EUR
        accruedMinor: '38000'
        recordedPaymentsMinor: '15000'
        outstandingMinor: '23000'
        dueMinor: '23000'
        openingStatus: known
    StatementEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - engagementId
      - kind
      - currency
      - deltaMinor
      - effectiveAt
      - postedAt
      properties:
        id:
          type: string
          format: uuid
        engagementId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - commission
          - refund
          - refund_reversal
          - external_payment
          - opening
          - reversal
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        deltaMinor:
          type: string
          pattern: ^(0|-?[1-9][0-9]*)$
        effectiveAt:
          type: string
          format: date-time
        postedAt:
          type: string
          format: date-time
        dueOn:
          type: string
          format: date
        basisMinor:
          type: string
          pattern: ^(0|-?[1-9][0-9]*)$
        rateBps:
          type: integer
          minimum: 0
        agreementId:
          type: string
          format: uuid
        customerLabel:
          type: string
          minLength: 1
        source:
          type: string
          enum:
          - stripe
          - dodo
          - whop
          - revenuecat
        sourceTransactionRef:
          type: string
          minLength: 1
        relatedEntryId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        paidOn:
          type: string
          format: date
        paymentReference:
          type: string
          minLength: 1
        recordedBy:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
    ExternalPayment:
      type: object
      additionalProperties: false
      required:
      - id
      - engagementId
      - currency
      - amountMinor
      - paidOn
      - recordedBy
      - recordedAt
      properties:
        id:
          type: string
          format: uuid
        engagementId:
          type: string
          format: uuid
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amountMinor:
          type: string
          pattern: ^[1-9][0-9]*$
        paidOn:
          type: string
          format: date
        reference:
          type: string
          minLength: 1
        recordedBy:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
    OpeningBalance:
      type: object
      additionalProperties: false
      required:
      - id
      - engagementId
      - currency
      - amountMinor
      - asOf
      - note
      properties:
        id:
          type: string
          format: uuid
        engagementId:
          type: string
          format: uuid
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amountMinor:
          type: string
          pattern: ^(0|-?[1-9][0-9]*)$
        asOf:
          type: string
          format: date
        note:
          type: string
          minLength: 1
        acceptedAt:
          type: string
          format: date-time
    Statement:
      type: object
      additionalProperties: false
      required:
      - engagementId
      - asOf
      - balances
      - entries
      properties:
        engagementId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date-time
        balances:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
        entries:
          $ref: '#/components/schemas/EntryPage'
        coverageIncomplete:
          type: boolean
          const: true
          description: An authoritative source for this product is disconnected, pending, overdue for reconciliation, or has incomplete history.
    EngagementSummary:
      type: object
      additionalProperties: false
      required:
      - engagement
      - companyName
      - productName
      - balances
      properties:
        engagement:
          $ref: '#/components/schemas/Engagement'
        companyName:
          type: string
          minLength: 1
        productName:
          type: string
          minLength: 1
        repEmail:
          type: string
          format: email
        nextDueOn:
          type: string
          format: date
        balances:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              minLength: 1
    CompanyPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        nextCursor:
          type: string
          minLength: 1
    ProductPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        nextCursor:
          type: string
          minLength: 1
    EngagementPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EngagementSummary'
        nextCursor:
          type: string
          minLength: 1
    AgreementPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgreementVersion'
        nextCursor:
          type: string
          minLength: 1
    ClaimPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
        nextCursor:
          type: string
          minLength: 1
    ConnectionPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
        nextCursor:
          type: string
          minLength: 1
    EntryPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StatementEntry'
        nextCursor:
          type: string
          minLength: 1
    ReviewPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewItem'
        nextCursor:
          type: string
          minLength: 1
    CoveragePage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CoverageGap'
        nextCursor:
          type: string
          minLength: 1
    MappingPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductMapping'
        nextCursor:
          type: string
          minLength: 1
  responses:
    E400:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E403:
      description: Action forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: Resource not visible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E409:
      description: State or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E410:
      description: Link expired or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E422:
      description: Domain rule or integration setup error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E429:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E500:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
