name: Verify public site

on:
  push:
    paths:
      - 'apps/site/**'
      - 'packages/contracts/**'
      - 'docs/technical/openapi.yaml'
      - '.node-version'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/public-site.yml'

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repharbor/site exec playwright install --with-deps chromium
      - run: pnpm verify:site
